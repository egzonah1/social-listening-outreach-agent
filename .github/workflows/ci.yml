# Runs on every push and pull request: the same checks we run locally.
# A red X on GitHub means something is broken before anyone deploys it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: outreach
          POSTGRES_PASSWORD: outreach  # throwaway CI database, not a real secret
          POSTGRES_DB: outreach
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U outreach"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://outreach:outreach@localhost:5433/outreach
      TEST_DATABASE_URL: postgresql+psycopg://outreach:outreach@localhost:5433/outreach_test
      APP_ENV: test
      # No AI keys in CI: the tests use fakes and never call a real AI service.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations

      - name: Type check (mypy)
        run: mypy app tests

      - name: Migrations apply to an empty database
        run: |
          alembic upgrade head
          alembic check  # fails if the models changed without a migration

      - name: Create the test database
        run: PGPASSWORD=outreach psql -h localhost -p 5433 -U outreach -c "CREATE DATABASE outreach_test"

      - name: Tests (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
